name: Deploy

on:
  push:
    branches:
      - main      # -> production stack
      - release   # -> test/staging stack
      - develop   # -> dev stack

# Don't cancel an in-flight deploy; queue per-branch instead.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: self-hosted

    steps:
      - name: Map branch to environment
        id: map
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "env=prod" >> "$GITHUB_OUTPUT"; echo "dir=/srv/mesapplishf/prod" >> "$GITHUB_OUTPUT" ;;
            release) echo "env=test" >> "$GITHUB_OUTPUT"; echo "dir=/srv/mesapplishf/test" >> "$GITHUB_OUTPUT" ;;
            develop) echo "env=dev"  >> "$GITHUB_OUTPUT"; echo "dir=/srv/mesapplishf/dev"  >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported branch ${{ github.ref_name }}"; exit 1 ;;
          esac

      - name: Run Docker deploy
        run: cd ${{ steps.map.outputs.dir }} && ./bin/deploy-docker.sh ${{ steps.map.outputs.env }}

  # Generate the phpDocumentor docs on main only, published later via GitHub Pages.
  docs:
    name: Generate docs
    if: github.ref_name == 'main'
    runs-on: self-hosted

    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{steps.deploy.outputs.page_url}}

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, zip, opcache

      - name: Install Graphviz (phpDocumentor class diagrams)
        run: command -v dot >/dev/null || { sudo apt-get update && sudo apt-get install -y graphviz; }

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # phpdoc.dist.xml drives the run and outputs HTML to docs/.build
      - name: Generate documentation with phpDocumentor
        run: vendor/bin/phpdoc --no-interaction

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.build
      
      - name: Deploy to Github Pages
        id: deploy
        uses: actions/deploy-pages@v5
