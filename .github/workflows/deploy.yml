name: Deploy

on:
  push:
    branches:
      - main      # -> production stack
      - release   # -> test/staging stack
      - develop   # -> dev stack

# Don't cancel an in-flight deploy; queue per-branch instead.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Map branch to environment
        id: map
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "env=prod" >> "$GITHUB_OUTPUT"; echo "dir=/srv/mesapplishf/prod" >> "$GITHUB_OUTPUT" ;;
            release) echo "env=test" >> "$GITHUB_OUTPUT"; echo "dir=/srv/mesapplishf/test" >> "$GITHUB_OUTPUT" ;;
            develop) echo "env=dev"  >> "$GITHUB_OUTPUT"; echo "dir=/srv/mesapplishf/dev"  >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported branch ${{ github.ref_name }}"; exit 1 ;;
          esac

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Run Docker deploy on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ steps.map.outputs.dir }} && ./bin/deploy-docker.sh ${{ steps.map.outputs.env }}"
