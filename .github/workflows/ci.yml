# .github/workflows/ci.yml
name: CI/CD

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:

env:
  # GHCR exige un nom en minuscules ; github.repository donne "EECKHOUTRemi/MesApplisHF"
  IMAGE: ghcr.io/eeckhoutremi/mesapplishf

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Stage 0: lint & static analysis (parallel with build) ───────
  # PR-only: the branch ruleset requires this check + an up-to-date branch
  # before merging, so the merge commit is already proven — no need to redo it on push.
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, zip, opcache, gd
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress --no-interaction
      - name: Linters Symfony (YAML, Twig, container)
        run: |
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:twig templates
          php bin/console lint:container
          # Dumps the test container, which PHPStan reads (voir phpstan.dist.neon).
          php bin/console lint:container --env=test
      - name: PHP_CodeSniffer (PSR-12, config phpcs.xml.dist)
        run: vendor/bin/phpcs
      - name: PHPStan (niveau 6 + baseline, config phpstan.dist.neon)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  # ── Stage 1: build ──────────────────────────────────────────────
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build prod image (load locally, don't push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
          pull: true           # always resolve latest digest for floating base-image tags
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: /tmp/image.tar

  # ── Stage 2: test ───────────────────────────────────────────────
  # PR-only: see note on the lint job above.
  test:
    needs: [build, lint]
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, zip, opcache
          coverage: xdebug # needed for Sonar coverage
      - run: composer install --prefer-dist --no-progress --no-interaction
      # En env "test", Doctrine suffixe le nom de base avec "_test" (config/packages/doctrine.yaml)
      # -> tout tourne sur "app_test", créée ici plutôt que par POSTGRES_DB
      - name: Prepare test database
        run: |
          php bin/console --env=test doctrine:database:create --if-not-exists
          php bin/console --env=test doctrine:migrations:migrate --no-interaction
        env:
          DATABASE_URL: postgresql://app:app@127.0.0.1:55440/app?serverVersion=16
      - run: php bin/phpunit --coverage-clover=coverage.xml
        env:
          DATABASE_URL: postgresql://app:app@127.0.0.1:55440/app?serverVersion=16
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  # ── Stage 3a: scan — Trivy (runs parallel with Sonar) ───────────
  # Runs on every build (PR and push), unlike lint/test/scan-sonar: `build`
  # uses `pull: true`, so a push-triggered rebuild can resolve a newer base
  # image than what the PR run scanned — the artifact itself isn't proven
  # safe until *this* build of it has been scanned.
  scan-trivy:
    needs: build
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # needed for the Trivy ignore policy
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp
      - run: docker load --input /tmp/image.tar
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "1" # fail the job on findings
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          ignore-policy: .trivy/ignore-policy.rego # kernel-header CVEs (see file)
      - name: Reclaim disk
        if: always()
        run: docker image rm -f "$IMAGE:${{ github.sha }}" || true


  # ── Stage 3b: scan — SonarQube (runs parallel with Trivy) ───────
  # PR-only: see note on the lint job above.
  scan-sonar:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar needs full history for blame
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: Vérifier la présence des secrets Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_HOST_URL" ]; then echo "SONAR_HOST_URL: défini (${#SONAR_HOST_URL} caractères)"; else echo "SONAR_HOST_URL: VIDE"; fi
          if [ -n "$SONAR_TOKEN" ]; then echo "SONAR_TOKEN: défini (${#SONAR_TOKEN} caractères)"; else echo "SONAR_TOKEN: VIDE"; fi
      - uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── Stage 4: push (only on main/release/develop) ────────────────
  # Waits on scan-trivy (which itself needs build): lint/test/scan-sonar are
  # PR-only (see above) since the branch ruleset already guarantees this exact
  # source tree passed them, but the built image is only proven safe once
  # *this* build has been Trivy-scanned.
  push:
    needs: scan-trivy
    if: github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    permissions:
      packages: write # for GHCR
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp
      - run: docker load --input /tmp/image.tar
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag & push
        run: |
          # "release/1.0" -> "release-1.0" : les "/" sont interdits dans un tag Docker
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          docker tag $IMAGE:${{ github.sha }} $IMAGE:$BRANCH_TAG
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:$BRANCH_TAG
      - name: Reclaim disk
        if: always()
        run: |
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          docker image rm -f "$IMAGE:${{ github.sha }}" "$IMAGE:$BRANCH_TAG" || true



    # ── Stage 5: deploy (only on main/release/develop) ────────────────
  deploy:
    needs: push
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}

    steps:
      - name: Map branch to environment
        id: map
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "env=prod" >> "$GITHUB_OUTPUT"; echo "dir=/srv/mesapplishf/prod" >> "$GITHUB_OUTPUT" ;;
            release) echo "env=test" >> "$GITHUB_OUTPUT"; echo "dir=/srv/mesapplishf/test" >> "$GITHUB_OUTPUT" ;;
            develop) echo "env=dev"  >> "$GITHUB_OUTPUT"; echo "dir=/srv/mesapplishf/dev"  >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported branch ${{ github.ref_name }}"; exit 1 ;;
          esac

      - name: Run Docker deploy
        run: cd ${{ steps.map.outputs.dir }} && ./bin/deploy-docker.sh ${{ steps.map.outputs.env }}

    # ── Stage 6: docs (only on main) ────────────────
  docs:
    needs: deploy
    if: github.ref_name == 'main'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{steps.deploy.outputs.page_url}}

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, zip, opcache

      - name: Install Graphviz (phpDocumentor class diagrams)
        run: command -v dot >/dev/null || { sudo apt-get update && sudo apt-get install -y graphviz; }

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # phpdoc.dist.xml drives the run and outputs HTML to docs/.build
      - name: Generate documentation with phpDocumentor
        run: vendor/bin/phpdoc --no-interaction

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.build

      - name: Deploy to Github Pages
        id: deploy
        uses: actions/deploy-pages@v5
