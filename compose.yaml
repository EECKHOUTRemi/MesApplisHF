services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      # NOTE: Docker Compose reads this project's .env (Symfony's .env) for ${...}
      # interpolation. Symfony's .env defines APP_ENV/APP_SECRET/MAILER_DSN, so we
      # set these LITERALLY here to avoid accidentally inheriting dev values.
      APP_ENV: prod
      APP_SECRET: ${SYMFONY_APP_SECRET:-my_secret_key_to_change}
      # Hostname "database" resolves to the Postgres service on the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@database:5432/${POSTGRES_DB:?POSTGRES_DB must be set}?serverVersion=16&charset=utf8
      MAILER_DSN: ${SYMFONY_MAILER_DSN:-null://null}
      # FrankenPHP listens on :80 inside the container.
      SERVER_NAME: ":80"
    ports:
      - "${HTTP_PORT:-8080}:80"
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - database_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped

volumes:
  database_data:
