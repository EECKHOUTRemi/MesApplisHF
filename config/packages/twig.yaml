twig:
    file_name_pattern: '*.twig'
    form_themes:
        - 'bootstrap_5_layout.html.twig'
    globals:
        # Clé publique Cloudflare Turnstile (widget anti-robot du formulaire d'inscription).
        turnstile_site_key: '%env(TURNSTILE_SITE_KEY)%'

when@test:
    twig:
        strict_variables: true
