# Identification du projet
# SonarCloud : la clé est "<organisation>_<repo>" et sonar.organization est obligatoire.
# SonarQube auto-hébergé : une clé libre suffit, supprimer sonar.organization.
sonar.projectKey=eeckhoutremi_MesApplisHF
sonar.organization=eeckhoutremi1

sonar.sources=src
sonar.tests=tests

# Couverture PHPUnit (générée par le job "test" du CI : --coverage-clover=coverage.xml)
sonar.php.coverage.reportPaths=coverage.xml

sonar.exclusions=vendor/**,var/**,public/build/**,migrations/**,assets/vendor/**
sonar.coverage.exclusions=migrations/**,config/**
